name: Render gallery
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'client-weapp-h5/**'
      - 'scripts/render_gallery.py'
      - '.github/workflows/render-gallery.yml'
permissions:
  contents: write
concurrency:
  group: render-gallery
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopencv-dev libsqlite3-dev libboost-dev ffmpeg
          npm --prefix frontend ci
          pip install playwright Pillow
          python -m playwright install --with-deps chromium
          cmake -S backend -B runtime/build -DCMAKE_BUILD_TYPE=Release
          cmake --build runtime/build -j2
          FSD_STARTUP_BENCHMARK=off ./runtime/build/fractal_studio_backend 18080 > /tmp/fractal-backend.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5174 > /tmp/fractal-web.log 2>&1 &
          python scripts/render_gallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: render-gallery
          path: |
            render-output/
            docs/generated/
          if-no-files-found: error
          retention-days: 14
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated/preview.webp
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh rendered gallery'
            git push origin HEAD
          fi
