name: Render gallery
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'client-weapp-h5/**'
      - 'scripts/render_gallery.py'
      - '.github/workflows/render-gallery.yml'
permissions:
  contents: write
concurrency:
  group: render-gallery
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopencv-dev libsqlite3-dev libboost-dev libmpfr-dev ffmpeg
          # The existing lockfile resolves Three.js outside model-viewer's peer range.
          npm --prefix frontend ci --legacy-peer-deps
          pip install playwright Pillow
          python -m playwright install --with-deps chromium
      - name: Build the native CPU backend
        run: |
          cmake -S backend -B runtime/build -DCMAKE_BUILD_TYPE=Release
          cmake --build runtime/build --target fractal_studio_backend -j2
      - name: Capture the running application
        run: |
          FSD_STARTUP_BENCHMARK=off ./runtime/build/fractal_studio_backend 18080 > /tmp/fractal-backend.log 2>&1 &
          VITE_BACKEND_PORT=18080 npm --prefix frontend run dev -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/fractal-web.log 2>&1 &
          python scripts/render_gallery.py || { cat /tmp/fractal-backend.log /tmp/fractal-web.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: render-gallery
          path: |
            render-output/
            docs/generated/
          if-no-files-found: error
          retention-days: 14
      - name: Publish gallery without overwriting concurrent commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gallery="$(mktemp)"
          cp docs/generated/gallery.webp "$gallery"
          trap 'rm -f "$gallery"' EXIT
          for attempt in 1 2 3; do
            git fetch --no-tags origin master
            # Do not publish an image of outdated application sources.
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- frontend/ backend/ client-weapp-h5/ scripts/render_gallery.py .github/workflows/render-gallery.yml; then
              echo "::notice::Rendering inputs changed during capture; a newer run will publish the gallery."
              exit 0
            fi
            # Reapply only the generated image to the latest branch tip.
            git reset --hard FETCH_HEAD
            mkdir -p docs/generated
            cp "$gallery" docs/generated/gallery.webp
            git add docs/generated/gallery.webp
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'docs: refresh rendered gallery'
            if git push origin HEAD:refs/heads/master; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::Unable to publish gallery after three non-forced push attempts."
          exit 1
